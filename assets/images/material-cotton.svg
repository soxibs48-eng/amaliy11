<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="cottonMatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EEE7DC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#cottonMatBg)" rx="16"/>

  <!-- Egyptian Sun Motif Accent -->
  <circle cx="200" cy="70" r="28" stroke="#C5A880" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 3"/>
  <circle cx="200" cy="70" r="14" fill="#E8DEC8" opacity="0.5"/>

  <!-- Organic Cotton Boll (Fluffy cloud of fibers) -->
  <g transform="translate(130, 90)">
    <!-- Sepals (dried bracts) -->
    <path d="M70 110L50 80L30 110L20 80L0 100L70 125L140 100L120 80L110 110L90 80Z" fill="#756247"/>
    <path d="M70 125V145" stroke="#756247" stroke-width="5" stroke-linecap="round"/>

    <!-- Soft Cloud Tufts -->
    <circle cx="45" cy="70" r="30" fill="#FFFFFF" stroke="#E5DEC8" stroke-width="1"/>
    <circle cx="95" cy="70" r="30" fill="#FFFFFF" stroke="#E5DEC8" stroke-width="1"/>
    <circle cx="70" cy="45" r="32" fill="#FFFFFF" stroke="#E5DEC8" stroke-width="1"/>
    <circle cx="70" cy="70" r="34" fill="#FCFAF6"/>

    <!-- Subtle texture folds -->
    <path d="M45 60C55 50 65 52 70 65" stroke="#E2DAC8" stroke-width="2" stroke-linecap="round"/>
    <path d="M95 60C85 50 75 52 70 65" stroke="#E2DAC8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="200" y="245" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#181816" text-anchor="middle">Egyptian Mako-Satin</text>
  <text x="200" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" font-weight="600" fill="#756754" text-anchor="middle">600 THREAD COUNT &bull; GIZA COTTON</text>
</svg>
