<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F7F3"/>
      <stop offset="100%" stop-color="#EFEAE1"/>
    </linearGradient>
    <linearGradient id="silkFolds1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5F0E6"/>
      <stop offset="70%" stop-color="#E7DFC9"/>
      <stop offset="100%" stop-color="#D4C7AC"/>
    </linearGradient>
    <filter id="pShadow1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3D3328" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad1)"/>
  
  <!-- Subtle circular pedestal -->
  <ellipse cx="300" cy="460" rx="230" ry="45" fill="#E2DBD0" opacity="0.6"/>

  <!-- Folded Mulberry Silk Bedding Set Presentation -->
  <g transform="translate(100, 110)" filter="url(#pShadow1)">
    <!-- Base folded duvet layer -->
    <rect x="20" y="190" width="360" height="150" rx="16" fill="url(#silkFolds1)"/>
    <path d="M20 230C100 215 220 240 380 220" stroke="#FFFFFF" stroke-width="6" opacity="0.8"/>
    <path d="M30 280C140 265 260 290 370 275" stroke="#E2D4BA" stroke-width="3" opacity="0.6"/>
    
    <!-- Second folded sheet layer -->
    <rect x="40" y="130" width="320" height="100" rx="14" fill="#FAF6EE" stroke="#E8DFCD" stroke-width="1.5"/>
    <path d="M45 165C120 150 240 175 355 160" stroke="#FFFFFF" stroke-width="5" opacity="0.9"/>
    
    <!-- Top Silk Pillow with Oxford Flange & Gold piping -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="280" height="130" rx="14" fill="url(#silkFolds1)" stroke="#D8CBAD" stroke-width="1.5"/>
      <!-- Inner piping border -->
      <rect x="14" y="14" width="252" height="102" rx="8" stroke="#C5A880" stroke-width="1.2" stroke-dasharray="6 3"/>
      <!-- Silk gleam curve -->
      <path d="M30 45C100 25 180 50 250 35" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <path d="M40 85C110 70 190 95 240 80" stroke="#DFCFAF" stroke-width="2.5" opacity="0.6"/>
    </g>

    <!-- Silk Satin Ribbon Wrap with Mollen seal -->
    <path d="M200 40V340" stroke="#C5A880" stroke-width="18" opacity="0.95"/>
    <path d="M200 40V340" stroke="#DFCCA8" stroke-width="4"/>
    <!-- Wax Seal / Emblem -->
    <circle cx="200" cy="180" r="22" fill="#9E805A" stroke="#C5A880" stroke-width="2"/>
    <circle cx="200" cy="180" r="18" fill="#846844"/>
    <text x="200" y="185" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#FDFBF7" text-anchor="middle">M</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(40, 40)">
    <rect width="135" height="30" rx="15" fill="#181816"/>
    <text x="67" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFF" text-anchor="middle">100% MULBERRY SILK</text>
  </g>
</svg>
