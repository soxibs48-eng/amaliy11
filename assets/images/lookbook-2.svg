<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="silkMacro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FBF8F2"/>
      <stop offset="50%" stop-color="#ECE4D4"/>
      <stop offset="75%" stop-color="#DFCFAF"/>
      <stop offset="100%" stop-color="#C2AF8C"/>
    </linearGradient>
    <linearGradient id="goldThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#846844"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#E5CCA8"/>
    </linearGradient>
    <filter id="macroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#EAE5DC"/>

  <!-- Fluid wave contours representing microscopic silk filament weaves -->
  <path d="M-50 100 Q 150 20 400 120 T 850 80 L 850 650 L -50 650 Z" fill="url(#silkMacro)"/>
  <path d="M-50 220 Q 200 120 420 240 T 850 180 L 850 650 L -50 650 Z" fill="url(#silkMacro)" opacity="0.9"/>
  <path d="M-50 340 Q 220 260 480 370 T 850 310 L 850 650 L -50 650 Z" fill="url(#silkMacro)" opacity="0.85"/>
  <path d="M-50 460 Q 250 380 520 490 T 850 430 L 850 650 L -50 650 Z" fill="url(#silkMacro)" opacity="0.75"/>

  <!-- Golden silk sheen highlights -->
  <path d="M-20 120 Q 180 35 410 135 T 820 95" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#macroGlow)"/>
  <path d="M-20 240 Q 210 135 435 255 T 820 195" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M-20 360 Q 230 275 495 385 T 820 325" stroke="#FDFBF7" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Hand-tailored Haute Couture French Seam Stitches in Gold -->
  <g stroke="url(#goldThread)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8">
    <path d="M-50 180 Q 180 80 410 190 T 850 140"/>
    <path d="M-50 300 Q 210 200 450 310 T 850 260"/>
  </g>

  <!-- Editorial Info Badge -->
  <g transform="translate(60, 60)">
    <rect width="240" height="70" rx="8" fill="#181816" opacity="0.92"/>
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#C5A880">GRADE 6A &bull; 22 MOMME</text>
    <text x="20" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-style="italic" fill="#FFF">Pure Mulberry Silk Fibers</text>
  </g>
</svg>
