<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5"/>
      <stop offset="100%" stop-color="#EFE8E3"/>
    </linearGradient>
    <linearGradient id="roseSilk" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FDF2EE"/>
      <stop offset="35%" stop-color="#F7DFD6"/>
      <stop offset="70%" stop-color="#EBC4B7"/>
      <stop offset="100%" stop-color="#D9A897"/>
    </linearGradient>
    <filter id="pShadow5" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#402D27" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad5)"/>
  <ellipse cx="300" cy="460" rx="220" ry="45" fill="#E2D4CD" opacity="0.6"/>

  <g transform="translate(100, 150)" filter="url(#pShadow5)">
    <!-- Silk Pillow Cushion -->
    <rect x="20" y="20" width="360" height="230" rx="20" fill="url(#roseSilk)" stroke="#E4BDB0" stroke-width="2"/>
    
    <!-- French Border Flange (Oxford Style 5cm) -->
    <rect x="42" y="42" width="316" height="186" rx="12" stroke="#FFFFFF" stroke-width="2" opacity="0.75"/>
    <rect x="40" y="40" width="320" height="190" rx="12" stroke="#C5A880" stroke-width="1.2" stroke-dasharray="8 4"/>

    <!-- Silk Soft Creases & Sheen Shimmer -->
    <path d="M50 70C150 50 250 80 340 60" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M60 120C170 100 270 135 345 115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M70 180C160 160 260 190 330 175" stroke="#CCA090" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Embroidered Mollen Monogram on Bottom Right -->
    <text x="320" y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" font-weight="600" fill="#9E805A" text-anchor="end">Mollen</text>
    <circle cx="328" cy="206" r="2" fill="#9E805A"/>

    <!-- Silk Sleeping Eye Mask resting atop pillow -->
    <g transform="translate(120, 90)">
      <ellipse cx="80" cy="30" rx="75" ry="32" fill="#FAF0EC" stroke="#C5A880" stroke-width="1.5" filter="url(#pShadow5)"/>
      <path d="M65 42C75 48 85 48 95 42" stroke="#C5A880" stroke-width="1.5" fill="none"/>
      <!-- Soft ruffled elastic strap -->
      <path d="M5 30C-20 28 -30 35 -40 40" stroke="#E4BDB0" stroke-width="6" stroke-linecap="round"/>
      <path d="M155 30C180 28 190 35 200 40" stroke="#E4BDB0" stroke-width="6" stroke-linecap="round"/>
      <text x="80" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="2" font-weight="600" fill="#B3897B" text-anchor="middle">PURE SILK</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(40, 40)">
    <rect width="185" height="30" rx="15" fill="#C89B7B"/>
    <text x="92" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFF" text-anchor="middle">BEAUTY SILK PILLOWCASE</text>
  </g>
</svg>
