<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F6F2"/>
      <stop offset="100%" stop-color="#EAE5DC"/>
    </linearGradient>
    <linearGradient id="robeSilk" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#1B382B"/>
      <stop offset="35%" stop-color="#2D5A47"/>
      <stop offset="70%" stop-color="#1E3F31"/>
      <stop offset="100%" stop-color="#12251D"/>
    </linearGradient>
    <filter id="pShadow4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14261E" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad4)"/>
  <ellipse cx="300" cy="480" rx="200" ry="40" fill="#DDD7CB" opacity="0.6"/>

  <!-- Elegant Wooden Coat Hanger -->
  <g transform="translate(180, 80)">
    <path d="M120 20C120 0 105 -15 90 -10C80 -6 80 10 95 10" stroke="#C5A880" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M10 50L120 20L230 50" stroke="#66533C" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Flowing Silk Kimono Robe on Hanger -->
  <g transform="translate(140, 115)" filter="url(#pShadow4)">
    <!-- Shoulders and Body -->
    <path d="M160 15
             L50 65 L20 180 L70 195 L95 110
             L95 420 C120 425 200 425 225 420
             L225 110 L250 195 L300 180 L270 65 Z"
          fill="url(#robeSilk)"/>

    <!-- Silk Sheen Highlights & Drape Folds -->
    <path d="M70 75C85 140 105 240 110 380" stroke="#487E66" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M73 78C88 143 108 243 113 380" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M250 75C235 140 215 240 210 380" stroke="#12251D" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- Kimono Lapel / Shawl Collar with Champagne Silk Trim -->
    <path d="M160 15L120 180L160 210L200 180Z" fill="#14261E"/>
    <path d="M160 15L115 190" stroke="#C5A880" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M160 15L205 190" stroke="#C5A880" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Belt (Obi Sash) Tied with Bow -->
    <g transform="translate(85, 200)">
      <rect x="0" y="0" width="150" height="24" rx="4" fill="#C5A880"/>
      <rect x="0" y="6" width="150" height="12" fill="#DFCCA8"/>
      <!-- Knot and hanging ribbons -->
      <ellipse cx="75" cy="12" rx="14" ry="10" fill="#9E805A"/>
      <path d="M70 12C60 40 50 80 45 110" stroke="#C5A880" stroke-width="10" stroke-linecap="round"/>
      <path d="M80 12C90 40 100 80 105 110" stroke="#9E805A" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Hem detail -->
    <line x1="95" y1="416" x2="225" y2="416" stroke="#C5A880" stroke-width="2"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(40, 40)">
    <rect width="160" height="30" rx="15" fill="#1B382B"/>
    <text x="80" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#DFCCA8" text-anchor="middle">SILK KIMONO ROBE</text>
  </g>
</svg>
